site_name: turbochroma
site_description: Drop-in vector compression for ChromaDB
repo_url: https://github.com/Moca9801/turbochroma
repo_name: Moca9801/turbochroma
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy

nav:
  - Home: index.md
  - API reference: reference.md
  - Design: design/001-why-turbochroma.md
  - Quality gates: quality-gates.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.superfences

strict: true
