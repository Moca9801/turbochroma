[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "turbochroma"
dynamic = ["version"]
description = "Drop-in vector compression for ChromaDB: 4x less RAM, <1% recall loss."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Angel Israel Moreno Castellanos", email = "aimc9801@gmail.com" },
]
keywords = [
    "chromadb",
    "vector-database",
    "quantization",
    "embeddings",
    "rag",
    "retrieval",
    "sq8",
    "scalar-quantization",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "chromadb>=0.5,<1",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
parquet = ["pyarrow>=15"]
bench = [
    "datasets>=2.18",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pip-audit>=2.6",
    "bandit[toml]>=1.7",
    "hypothesis>=6.100",
]

[project.urls]
Homepage = "https://github.com/Moca9801/turbochroma"
Repository = "https://github.com/Moca9801/turbochroma"
Issues = "https://github.com/Moca9801/turbochroma/issues"
Changelog = "https://github.com/Moca9801/turbochroma/blob/main/CHANGELOG.md"
Stability = "https://github.com/Moca9801/turbochroma/blob/main/STABILITY.md"

[tool.hatch.version]
path = "src/turbochroma/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/turbochroma"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "AUTHORS.md",
    "CREDITS.md",
    "pyproject.toml",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "STABILITY.md",
    "CODE_OF_CONDUCT.md",
    ".pre-commit-config.yaml",
]

# ─── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]  # test function names often break convention

# ─── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bench: marks tests that are actually benchmarks",
]

# ─── Mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
disallow_any_unimported = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "numba.*", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hypothesis", "hypothesis.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv"]

# ─── Coverage ────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/turbochroma"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
